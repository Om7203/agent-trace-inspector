name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Verify generated evaluation is committed
        run: git diff --exit-code -- docs/evaluation.json
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - uses: actions/upload-artifact@v4
        if: matrix.node-version == 22
        with:
          name: evaluation-report
          path: docs/evaluation.json

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: agent-trace-inspector:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
      - name: Compile Azure infrastructure
        uses: azure/CLI@v2
        with:
          inlineScript: az bicep build --file infra/main.bicep --stdout > /dev/null

  operability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run smoke and load checks
        run: |
          node src/server.mjs > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..10}; do
            if curl --fail --silent http://127.0.0.1:3100/api/health/ready > /dev/null; then
              break
            fi
            if [[ "$attempt" == "10" ]]; then
              cat server.log
              exit 1
            fi
            sleep 1
          done
          npm run smoke -- http://127.0.0.1:3100
          npm run load:test -- http://127.0.0.1:3100
